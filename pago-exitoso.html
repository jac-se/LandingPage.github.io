<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pago exitoso | JACC Software</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #020617;
        padding: 32px;
        border-radius: 12px;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      h1 {
        color: #22c55e;
        margin-bottom: 12px;
      }
      p {
        color: #cbd5f5;
        line-height: 1.6;
      }
      .hint {
        margin-top: 20px;
        font-size: 0.9rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>✅ Pago recibido</h1>
      <p>Tu pago fue procesado correctamente.</p>
      <p>
        Ahora regresa a la aplicación <strong>Duplicador JACC</strong> y
        presiona el botón <strong>“Verificar licencia”</strong>.
      </p>
      <p class="hint">
        Si no se activa de inmediato, espera unos segundos y vuelve a verificar.
      </p>
    </div>
  </body>
</html>
